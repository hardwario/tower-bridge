<text x="110" y="282" class="mg-t mg-s mg-b" data-i18n="common.avg">avg</text><text x="110" y="300" class="mg-t">22.8 °C</text>
<text x="190" y="282" class="mg-t mg-s mg-b" data-i18n="common.max">max</text><text x="190" y="300" class="mg-t">25.1 °C</text>
