<g transform="translate(597 67) scale(.667)" class="mg-icon"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></g>
<text x="30" y="135" class="mg-t mg-b" style="font-size:40px">22.4</text><text x="122" y="135" class="mg-t mg-s" style="font-size:18px">°C</text>
