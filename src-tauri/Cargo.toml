[package]
name = "tower-bridge"
description = "Desktop app for the HARDWARIO TOWER Bridge Module and Climate Module"
version = "1.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "tower-bridge"

[lib]
name = "tower_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tower-bridge-core = { workspace = true, features = ["store", "mqtt", "api", "xlsx"] }
tower-bridge-service.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
fontdue = "0.9"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Notifications through UserNotifications (the notification plugin's
# NSUserNotification delivers nothing on current macOS) and Open at Login
# through SMAppService.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSProcessInfo", "NSString", "NSUUID"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[lints]
workspace = true
