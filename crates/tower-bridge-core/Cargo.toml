[package]
name = "tower-bridge-core"
description = "HARDWARIO TOWER Bridge Module (FT260) and Climate Module drivers, storage and MQTT"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
store = ["dep:rusqlite", "dep:chrono"]
mqtt = ["dep:rumqttd", "dep:bytes", "dep:pollster", "dep:serde_json"]
api = ["store", "dep:axum", "dep:tokio", "dep:serde_json"]
xlsx = ["store", "dep:rust_xlsxwriter"]

[dependencies]
crossbeam-channel.workspace = true
hidapi.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

bytes = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
rumqttd = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rust_xlsxwriter = { version = "0.100", optional = true, features = ["constant_memory"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio"] }
serde_json = { workspace = true, optional = true }
tokio = { version = "1", optional = true, features = ["rt", "net", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
i2cdev = "0.6"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
