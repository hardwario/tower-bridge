[workspace]
resolver = "3"
members = ["crates/tower-bridge-core", "crates/tower-bridge-service", "crates/tower-bridge-cli", "src-tauri"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
authors = ["HARDWARIO a.s. <ask@hardwario.com>"]
repository = "https://github.com/hardwario/tower-bridge"
rust-version = "1.99"

[workspace.dependencies]
tower-bridge-core = { path = "crates/tower-bridge-core" }
tower-bridge-service = { path = "crates/tower-bridge-service" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
hidapi = "2.6"
parking_lot = "0.12"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
