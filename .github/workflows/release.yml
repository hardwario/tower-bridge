name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: everything is built and checked, nothing is published.
  workflow_dispatch:

# Read-only by default; only the final job writes the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The tag must match every version (a dry run checks only that they agree).
      - run: node scripts/check-version.mjs
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run notices -- --check
      - run: cargo test --workspace --all-features

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: linux
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage
          - name: windows
            os: windows-latest
            rust-targets: ""
            args: --no-bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf libfuse2
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Only this step sees the Apple secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without a certificate the build is ad-hoc signed: empty variables
          # would make Tauri try to sign and notarize.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build ${{ matrix.args }}
      # The portable exe must start on a Windows without the Visual C++
      # runtime. tauri-build links the VC runtime statically and the
      # Universal CRT dynamically (staticVCRuntime); the UCRT is part of
      # every Windows 10 and 11, so only the VC runtime DLLs fail the check.
      - name: Check that the exe needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $deps = & $dumpbin.FullName /nologo /dependents target\release\tower-bridge.exe
          $deps
          $crt = $deps -match 'vcruntime|msvcp'
          if ($crt) { Write-Error "tower-bridge.exe depends on the Visual C++ runtime: $crt"; exit 1 }
      - name: Collect artifacts
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"  # a dry run on feature/x
          mkdir -p out
          case "${{ matrix.name }}" in
            macos)   cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/tower-bridge-$v-macos-universal.dmg" ;;
            linux)   cp target/release/bundle/appimage/*.AppImage "out/tower-bridge-$v-linux-x86_64.AppImage"
                     cp packaging/linux/70-hardwario-tower-bridge.rules out/ ;;
            # Signed, checksummed and released by the sign job.
            windows) cp target/release/tower-bridge.exe "out/tower-bridge-$v-windows-x64-portable.exe" ;;
          esac
          cd out
          if [ "${{ matrix.name }}" != windows ]; then
            for f in tower-bridge-*; do
              if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            done
          fi
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name == 'windows' && 'unsigned-windows' || matrix.name }}
          path: out/*

  # tower-bridge-cli: an archive per target. Linux builds run in the `cross`
  # images (Cross.toml adds libudev), so the binaries need only an old glibc.
  cli:
    name: CLI (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: universal-apple-darwin
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          case "$target" in
            universal-apple-darwin)
              for t in aarch64-apple-darwin x86_64-apple-darwin; do
                cargo build --release --locked -p tower-bridge-cli --target "$t"
              done
              mkdir -p target/universal-apple-darwin/release
              lipo -create -output target/universal-apple-darwin/release/tower-bridge-cli \
                target/aarch64-apple-darwin/release/tower-bridge-cli target/x86_64-apple-darwin/release/tower-bridge-cli ;;
            *-linux-*) cross build --release --locked -p tower-bridge-cli --target "$target" ;;
            *) cargo build --release --locked -p tower-bridge-cli --target "$target" ;;
          esac
      # Runs on any glibc distribution from 2018 on (Debian 10, Ubuntu 20.04,
      # Raspberry Pi OS Buster).
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          newest=$(readelf --version-info "target/${{ matrix.target }}/release/tower-bridge-cli" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
          echo "newest glibc symbol: $newest"
          if [ "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -n 1)" != "GLIBC_2.28" ]; then
            echo "::error::tower-bridge-cli needs $newest, newer than glibc 2.28"; exit 1
          fi
      - name: Check that the exe needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $deps = & $dumpbin.FullName /nologo /dependents target\x86_64-pc-windows-msvc\release\tower-bridge-cli.exe
          $deps
          $crt = $deps -match 'vcruntime|msvcp|api-ms-win-crt|ucrtbase'
          if ($crt) { Write-Error "tower-bridge-cli.exe depends on the C runtime: $crt"; exit 1 }
      - name: Package
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          v="${GITHUB_REF_NAME#v}"
          name="tower-bridge-cli-${v//\//-}-$target"
          mkdir -p "out/$name"
          cp docs/cli.md "out/$name/README.md"
          cp LICENSE THIRD-PARTY-NOTICES.md "out/$name/"
          case "$target" in
            *-windows-*) cp "target/$target/release/tower-bridge-cli.exe" "out/$name/" ;;
            *-linux-*) cp "target/$target/release/tower-bridge-cli" packaging/linux/70-hardwario-tower-bridge.rules "out/$name/" ;;
            *) cp "target/$target/release/tower-bridge-cli" "out/$name/" ;;
          esac
          cd out
          # The Windows folder is signed, zipped and checksummed by the sign job.
          if [[ "$target" != *-windows-* ]]; then
            tar czf "$name.tar.gz" "$name"
            rm -r "$name"
            if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          fi
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ contains(matrix.target, 'windows') && 'unsigned-' || '' }}cli-${{ matrix.target }}
          path: out/*

  # Authenticode signing of the Windows binaries with Azure Artifact Signing
  # (docs/release.md). A job of its own, so only these steps can get the
  # OIDC token, in the `signing` environment, which admits only release tags.
  sign:
    name: Sign (Windows)
    needs: [build, cli]
    # A pushed release tag, or a dry run started on one; branch dry runs stay
    # unsigned and are never published.
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: signing
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: unsigned
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Our own two exes only: the app and the CLI link everything else
      # statically, and there is no installer.
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: hardwario
          certificate-profile-name: hardwario
          files-folder: ${{ github.workspace }}\unsigned
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          # The certificates live about three days; only the timestamp keeps
          # a signature valid after that.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: TOWER Bridge
          description-url: https://github.com/hardwario/tower-bridge
          # The Azure CLI login above; the other credential types would only
          # be tried and fail first.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify the signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem unsigned -Recurse -Filter *.exe
          if ($files.Count -ne 2) { Write-Error "expected the app and the CLI, found: $($files.FullName -join ', ')"; exit 1 }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1}, signed by {2}, timestamped by {3}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject, $sig.TimeStamperCertificate.Subject
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name): signature $($sig.Status): $($sig.StatusMessage)"; exit 1 }
            if ($sig.SignerCertificate.Subject -notlike '*HARDWARIO a.s.*') { Write-Error "$($f.Name): signed by $($sig.SignerCertificate.Subject)"; exit 1 }
            if (-not $sig.TimeStamperCertificate) { Write-Error "$($f.Name): no timestamp"; exit 1 }
          }
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          cp unsigned/unsigned-windows/tower-bridge-*-windows-x64-portable.exe out/
          cd unsigned/unsigned-cli-x86_64-pc-windows-msvc
          name=$(echo tower-bridge-cli-*)
          7z a -bd "../../out/$name.zip" "$name" > /dev/null
          cd ../../out
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*

  # One job creates the draft release, so the builds cannot race to make two.
  publish:
    name: Draft release
    needs: [build, cli, sign]
    # Only a pushed tag: a dry run started on a tag must not replace the
    # assets of its release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      # Everything but the unsigned Windows builds the sign job started from.
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir out
          for d in artifacts/*/; do
            case "$(basename "$d")" in unsigned-*) continue ;; esac
            cp -r "$d". out/
          done
          ls -la out
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: out/*
