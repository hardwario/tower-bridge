name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the final job writes the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run notices -- --check
      - run: cargo test --workspace --all-features

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: linux
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage
          - name: windows
            os: windows-latest
            rust-targets: ""
            args: --no-bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf libfuse2
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Only this step sees the Apple secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without a certificate the build is ad-hoc signed: empty variables
          # would make Tauri try to sign and notarize.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build ${{ matrix.args }}
      # The portable exe must start on a Windows without the Visual C++
      # runtime: .cargo/config.toml links the C runtime statically.
      - name: Check that the exe needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $deps = & $dumpbin.FullName /nologo /dependents target\release\tower-bridge.exe
          $deps
          $crt = $deps -match 'vcruntime|msvcp|api-ms-win-crt|ucrtbase'
          if ($crt) { Write-Error "tower-bridge.exe depends on the C runtime: $crt"; exit 1 }
      - name: Collect artifacts
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          case "${{ matrix.name }}" in
            macos)   cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/TOWER-Bridge-$v-macos-universal.dmg" ;;
            linux)   cp target/release/bundle/appimage/*.AppImage "out/TOWER-Bridge-$v-linux-x86_64.AppImage"
                     cp packaging/linux/70-hardwario-tower-bridge.rules out/ ;;
            windows) cp target/release/tower-bridge.exe "out/TOWER-Bridge-$v-windows-x64-portable.exe" ;;
          esac
          cd out
          for f in TOWER-Bridge-*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/*

  # One job creates the draft release, so the builds cannot race to make two.
  publish:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: out/*
